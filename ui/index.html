<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求索下载 · 媒体批量下载工具</title>
<style>
:root,
:root[data-theme="dark"]{
  --page:#101318; --bg:#181C24; --panel:#1E232E; --panel-2:#262C3A; --panel-3:#2E3545;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.11); --border-hover:rgba(255,255,255,.16);
  --ink-1:#EEF1F6; --ink-2:#A8B2C2; --ink-3:#6B7689;
  --accent:#2FD3C5; --accent-2:#1AB5A8; --accent-soft:rgba(47,211,197,.10); --on-accent:#05100E;
  --ok:#3FCB86; --ok-soft:rgba(63,203,134,.12); --warn:#E8A33D; --warn-soft:rgba(232,163,61,.14);
  --bad:#FF6B5A; --bad-soft:rgba(255,107,90,.12); --info:#5E9EFF; --info-soft:rgba(94,158,255,.12);
  --logo-grad-1:#2FD3C5; --logo-grad-2:#1AB5A8; --logo-grad-3:#0E8A80;
  --logo-highlight:rgba(255,255,255,.25);
  --logo-glow:rgba(47,211,197,.4);
  --r-shell:14px; --r-card:10px; --r-control:7px; --r-pill:999px; --row:42px;
}
:root[data-theme="light"]{
  --page:#F5F7FA; --bg:#FFFFFF; --panel:#F0F2F5; --panel-2:#E8EBF0; --panel-3:#DDE1E8;
  --border:rgba(0,0,0,.06); --border-strong:rgba(0,0,0,.10); --border-hover:rgba(0,0,0,.15);
  --ink-1:#1A1D23; --ink-2:#4A5160; --ink-3:#8B93A3;
  --accent:#0EA5A0; --accent-2:#0D9488; --accent-soft:rgba(14,165,160,.10); --on-accent:#FFFFFF;
  --ok:#16A34A; --ok-soft:rgba(22,163,74,.12); --warn:#D97706; --warn-soft:rgba(217,119,6,.14);
  --bad:#DC2626; --bad-soft:rgba(220,38,38,.12); --info:#2563EB; --info-soft:rgba(37,99,235,.12);
  --logo-grad-1:#0EA5A0; --logo-grad-2:#0D9488; --logo-grad-3:#0F766E;
  --logo-highlight:rgba(255,255,255,.2);
  --logo-glow:rgba(14,165,160,.25);
  --r-shell:14px; --r-card:10px; --r-control:7px; --r-pill:999px; --row:42px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% 30%,#14181F 0%,#0A0C10 100%);color:var(--ink-1);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:auto;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:40px 20px;box-sizing:border-box}
[data-theme="light"] body{background:radial-gradient(1200px 800px at 50% 30%,#E8EBF0 0%,#D5DAE3 100%)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.ic{width:16px;height:16px}.ic-sm{width:14px;height:14px}
.window{display:flex;flex-direction:column;width:960px;height:640px;background:var(--page);border-radius:14px;overflow:hidden;resize:both;min-width:900px;min-height:600px;max-width:95vw;max-height:95vh;box-shadow:0 24px 64px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);position:relative}
[data-theme="light"] .window{box-shadow:0 24px 64px -16px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.08)}
.resize-handle{position:absolute;right:4px;bottom:2px;width:14px;height:14px;color:var(--ink-3);opacity:.5;pointer-events:none;z-index:10}
.titlebar{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--logo-grad-1) 0%,var(--logo-grad-2) 60%,var(--logo-grad-3) 100%);display:grid;place-items:center;box-shadow:0 2px 8px -2px var(--logo-glow),inset 0 1px 0 var(--logo-highlight)}
.brand .logo svg{width:15px;height:15px;color:var(--on-accent)}
.brand .name{font-size:14px;font-weight:650}
.brand .ver{font-size:11.5px;color:var(--ink-3);margin-left:2px}
.env-status{display:flex;align-items:center;gap:6px;margin-left:8px}
.env-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok-soft)}
.env-label{font-size:11.5px;color:var(--ink-3)}
.titlebar .sp{flex:1}
.titlebar .actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.icon-btn:hover{background:var(--panel-2);color:var(--ink-1)}
.icon-btn svg{width:15px;height:15px}
.main{flex:1;display:flex;min-height:0;gap:12px;padding:12px}
.left-panel{width:360px;display:flex;flex-direction:column;gap:12px;flex:none}
.right-panel{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.panel-header{height:42px;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex:none}
.panel-title{font-size:13px;font-weight:600}
.panel-title .count{font-weight:400;color:var(--ink-3);margin-left:4px;font-size:12px}
.panel-body{flex:1;min-height:0;overflow-y:auto}
.segment{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:2px;gap:2px}
.segment button{height:26px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--ink-2);transition:.15s}
.segment button.on{background:var(--panel-3);color:var(--ink-1)}
.import-panel .panel-body{padding:12px;display:flex;flex-direction:column;gap:10px}
.import-textarea{flex:1;min-height:0;background:var(--panel);border:0;outline:0;resize:none;padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--ink-2);font-family:"SF Mono","Consolas","Menlo",monospace}
.import-textarea::placeholder{color:var(--ink-3);line-height:1.7}
.import-actions{display:flex;gap:8px;align-items:center}
.import-actions .btn{flex:1}
.btn{height:36px;padding:0 14px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);color:var(--ink-1);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:var(--border-hover)}
.btn:active{background:var(--panel-2)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent-2);border-color:transparent}
.btn-danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn-danger:hover{opacity:.9}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--panel-2);color:var(--ink-1)}
.btn-lg{height:42px;padding:0 18px;font-size:13.5px}
.btn-lg svg{width:16px;height:16px}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-sm svg{width:14px;height:14px}
.btn-smart{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent)}
.btn-smart:hover{background:var(--accent);color:var(--on-accent)}
.batch-row{display:flex;align-items:center;gap:8px;padding:8px 0}
.batch-row label{font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.batch-row .sub{font-size:11.5px;color:var(--ink-3);margin-left:4px}
.checkbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-strong);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.checkbox.on{background:var(--accent);border-color:var(--accent)}
.checkbox svg{width:11px;height:11px;color:var(--on-accent)}
.smart-grab-section{padding:0 12px 12px;display:flex;flex-direction:column;align-items:center;gap:0}
.smart-grab-section .btn-smart{width:100%}
.task-table{width:100%;border-collapse:collapse;font-size:12.5px}
.task-table th{text-align:left;font-weight:500;font-size:11.5px;color:var(--ink-3);padding:0 12px;height:36px;border-bottom:1px solid var(--border);background:var(--panel)}
.task-table td{padding:0 12px;height:42px;border-bottom:1px solid var(--border);vertical-align:middle}
.task-table tbody tr:hover{background:var(--panel-2)}
.col-check{width:36px;padding-left:14px!important}
.col-size{width:80px}
.col-progress{width:180px}
.col-speed{width:90px}
.col-status{width:80px}
.col-ops{width:70px;text-align:right}
.task-name{display:flex;align-items:center;gap:10px;min-width:0}
.file-ic{width:28px;height:28px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.file-ic svg{width:15px;height:15px;color:var(--accent)}
.file-ic.video svg{color:var(--accent)}
.task-name .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task-name .title{font-size:12.5px;color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-name .src{font-size:11px;color:var(--ink-3)}
.progress{display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:6px;border-radius:999px;background:var(--panel-3);overflow:hidden;min-width:80px}
.progress-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:.3s width}
.progress-bar.done i{background:var(--ok)}
.progress-bar.error i{background:var(--bad)}
.progress-bar.paused i{background:var(--ink-3)}
.pct{font-size:11.5px;color:var(--ink-2);width:38px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500}
.tag.downloading{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.waiting{background:var(--panel-3);color:var(--ink-2)}
.tag.error{background:var(--bad-soft);color:var(--bad)}
.tag.paused{background:var(--warn-soft);color:var(--warn)}
.row-ops{display:inline-flex;gap:2px}
.row-ops button{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);transition:.15s}
.row-ops button:hover{background:var(--panel-3);color:var(--ink-1)}
.row-ops svg{width:14px;height:14px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.empty-ic{width:48px;height:48px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;margin-bottom:12px;color:var(--ink-3)}
.empty-ic svg{width:24px;height:24px}
.empty-state b{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.empty-state p{font-size:12px;color:var(--ink-3);line-height:1.6}
.bottom{border-top:1px solid var(--border);background:var(--bg);padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;flex:none}
.overall-bar{display:flex;align-items:center;gap:12px}
.overall-bar .label{font-size:12px;color:var(--ink-3);flex:none}
.overall-bar .track{flex:1;height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.overall-bar .track i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:.3s width}
.overall-bar .stats{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex:none}
.overall-bar .stats b{color:var(--ink-1);font-weight:600}
.overall-bar .speed{color:var(--accent);font-weight:500}
.log-area{height:80px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:8px 12px;overflow-y:auto;font-family:"SF Mono","Consolas","Menlo",monospace;font-size:11.5px;line-height:1.8}
.log-line{display:flex;gap:10px}
.log-line .time{color:var(--ink-3);flex:none}
.log-line .msg{color:var(--ink-2)}
.log-line .msg.ok{color:var(--ok)}
.log-line .msg.warn{color:var(--warn)}
.log-line .msg.bad{color:var(--bad)}
.log-line .msg.info{color:var(--info)}
.log-line .msg.poem{color:var(--ink-3);font-style:italic;font-size:11px}
.action-bar{display:flex;align-items:center;gap:10px}
.action-group{display:flex;gap:6px}
.action-divider{width:1px;height:24px;background:var(--border)}
.action-bar .sp{flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.96);width:480px;background:var(--page);border:1px solid var(--border);border-radius:14px;padding:24px;z-index:101;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 24px 64px -16px rgba(0,0,0,.6)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:16px;font-weight:650;margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
.form-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.form-row:last-of-type{border-bottom:0}
.form-row label{width:110px;font-size:12.5px;color:var(--ink-2);flex:none}
.form-row .val{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.path-input{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:var(--panel)}
.path-input input{flex:1;background:transparent;border:0;outline:0;padding:0 10px;font-size:12px;color:var(--ink-1);min-width:0}
.btn-browse{padding:0 12px;background:var(--panel-2);color:var(--ink-2);font-size:11.5px;border-left:1px solid var(--border);transition:.15s}
.btn-browse:hover{background:var(--panel-3);color:var(--ink-1)}
.num-input{width:80px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--panel);padding:0 10px;font-size:12px;color:var(--ink-1);outline:0;transition:.15s}
.num-input:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--ink-3)}
.switch{width:36px;height:20px;border-radius:999px;background:var(--panel-3);position:relative;cursor:pointer;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);transition:.2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px;background:var(--on-accent)}
.modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:10px 18px;font-size:13px;color:var(--ink-1);box-shadow:0 8px 32px -8px rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--ok)}
</style>
</head>

const tasks=[

const statusMap={downloading:{label:"下载中",cls:"downloading"},done:{label:"已完成",cls:"done"},waiting:{label:"等待中",cls:"waiting"},error:{label:"失败",cls:"error"},paused:{label:"已暂停",cls:"paused"}};
function renderTasks(filter="all"){
  const body=document.getElementById("taskBody");
  const filtered=filter==="all"?tasks:tasks.filter(t=>t.status===filter);
  if(filtered.length===0){body.innerHTML='<div class="empty-state"><div class="empty-ic"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,56H216V88H40Zm0,144V104H216v96Z"/></svg></div><b>暂无'+(filter==="all"?"":statusMap[filter]?.label||"")+'任务</b><p>在左侧粘贴钉钉链接，点击「解析到任务列表」即可开始下载</p></div>';return;}

192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg></button></div></td></tr>';}).join("")+'</tbody></table>';
}
renderTasks();updateOverall();
document.getElementById("logArea").scrollTop=document.getElementById("logArea").scrollHeight;
function updateOverall(){const done=tasks.filter(t=>t.status==="done").length;const total=tasks.length;const avg=Math.round(tasks.reduce((s,t)=>s+t.progress,0)/total);document.getElementById("doneCount").textContent=done;document.getElementById("totalCount").textContent=total;document.getElementById("taskTotal").textContent=total;document.getElementById("overallTrack").style.width=avg+"%";}
document.querySelectorAll("#filterSeg button").forEach(b=>{b.onclick=()=>{document.querySelectorAll("#filterSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderTasks(b.dataset.filter);};});
document.getElementById("selectAll").onclick=()=>{const c=document.getElementById("allCheck");c.classList.toggle("on");showToast(c.classList.contains("on")?"已全选所有任务":"已取消全选");};
let downloading=false;
document.getElementById("startBtn").onclick=()=>{if(downloading){showToast("任务已在下载中");return;}downloading=true;addLog("开始下载任务：季度复盘会议录像","ok");showToast("已开始下载");const task=tasks.find(t=>t.status==="downloading");if(task){const timer=setInterval(()=>{task.progress+=2;if(task.progress>=100){task.progress=100;task.status="done";task.speed="";clearInterval(timer);downloading=false;addLog("季度复盘会议录像 下载完成","ok");showToast("下载完成：季度复盘会议录像");}renderTasks(document.querySelector("#filterSeg button.on").dataset.filter);updateOverall();},300);}};
document.getElementById("stopBtn").onclick=()=>{downloading=false;const task=tasks.find(t=>t.status==="downloading");if(task){task.status="paused";task.speed="";}renderTasks();addLog("下载已暂停","warn");showToast("已暂停下载");};
document.getElementById("parseBtn").onclick=()=>{const ta=document.querySelector(".import-textarea");if(!ta.value.trim()){showToast("请先粘贴下载链接");return;}addLog("解析链接完成，已添加 1 个任务","ok");showToast("已解析到任务列表");};
document.getElementById("openDirBtn").onclick=()=>showToast("已打开保存目录");
document.getElementById("reloginBtn").onclick=()=>{addLog("正在跳转钉钉授权登录…","");showToast("正在打开登录页面");};
document.getElementById("updateBtn").onclick=()=>{addLog("当前已是最新版本 v1.0","ok");showToast("当前已是最新版本");};
document.getElementById("importText").onclick=()=>{document.querySelector(".import-textarea").value="https://dingtalk.com/live/xxxxxx\nhttps://dingtalk.com/group/playback/yyyyyy";showToast("已导入文本链接");};
document.getElementById("importQr").onclick=()=>showToast("请选择二维码图片");
document.getElementById("clearInput").onclick=()=>{document.querySelector(".import-textarea").value="";showToast("已清空输入");};
document.getElementById("batchCheckWrap").addEventListener("click",function(e){e.preventDefault();document.getElementById("batchCheck").classList.toggle("on");});
document.getElementById("smartGrab").onclick=()=>{addLog("正在扫描已打开的钉钉群回放页面…","");setTimeout(()=>{addLog("发现 2 个已加载的群回放，已按群名保存","ok");showToast("已获取 2 个群回放链接");},800);};
const scrim=document.getElementById("scrim"),modal=document.getElementById("settingsModal");
function openModal(on){scrim.classList.toggle("on",on);modal.classList.toggle("on",on);}
document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||"dark";const next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);showToast(next==="light"?"已切换到浅色主题":"已切换到深色主题");};
document.getElementById("settingsBtn").onclick=()=>openModal(true);
scrim.onclick=()=>openModal(false);
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>openModal(false));
document.querySelectorAll(".switch").forEach(s=>{s.onclick=()=>s.classList.toggle("on");});
function addLog(msg,type=""){const area=document.getElementById("logArea");const now=new Date();const t="["+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0")+"]";const line=document.createElement("div");line.className="log-line";line.innerHTML='<span class="time">'+t+'</span><span class="msg '+type+'">'+msg+'</span>';area.appendChild(line);area.scrollTop=area.scrollHeight;}
let toastTimer;
function showToast(msg){const t=document.getElementById("toast");document.getElementById("toastMsg").textContent=msg;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),2000);}
</script>
