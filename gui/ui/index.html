<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求索下载 · 媒体批量下载工具</title>
<style>
:root,
:root[data-theme="dark"]{
  --page:#101318; --bg:#181C24; --panel:#1E232E; --panel-2:#262C3A; --panel-3:#2E3545;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.11); --border-hover:rgba(255,255,255,.16);
  --ink-1:#EEF1F6; --ink-2:#A8B2C2; --ink-3:#6B7689;
  --accent:#2FD3C5; --accent-2:#1AB5A8; --accent-soft:rgba(47,211,197,.10); --on-accent:#05100E;
  --ok:#3FCB86; --ok-soft:rgba(63,203,134,.12); --warn:#E8A33D; --warn-soft:rgba(232,163,61,.14);
  --bad:#FF6B5A; --bad-soft:rgba(255,107,90,.12); --info:#5E9EFF; --info-soft:rgba(94,158,255,.12);
  --logo-grad-1:#2FD3C5; --logo-grad-2:#1AB5A8; --logo-grad-3:#0E8A80;
  --logo-highlight:rgba(255,255,255,.25);
  --logo-glow:rgba(47,211,197,.4);
  --r-shell:14px; --r-card:10px; --r-control:7px; --r-pill:999px; --row:42px;
}
:root[data-theme="light"]{
  --page:#F5F7FA; --bg:#FFFFFF; --panel:#F0F2F5; --panel-2:#E8EBF0; --panel-3:#DDE1E8;
  --border:rgba(0,0,0,.06); --border-strong:rgba(0,0,0,.10); --border-hover:rgba(0,0,0,.15);
  --ink-1:#1A1D23; --ink-2:#4A5160; --ink-3:#8B93A3;
  --accent:#0EA5A0; --accent-2:#0D9488; --accent-soft:rgba(14,165,160,.10); --on-accent:#FFFFFF;
  --ok:#16A34A; --ok-soft:rgba(22,163,74,.12); --warn:#D97706; --warn-soft:rgba(217,119,6,.14);
  --bad:#DC2626; --bad-soft:rgba(220,38,38,.12); --info:#2563EB; --info-soft:rgba(37,99,235,.12);
  --logo-grad-1:#0EA5A0; --logo-grad-2:#0D9488; --logo-grad-3:#0F766E;
  --logo-highlight:rgba(255,255,255,.2);
  --logo-glow:rgba(14,165,160,.25);
  --r-shell:14px; --r-card:10px; --r-control:7px; --r-pill:999px; --row:42px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% 30%,#14181F 0%,#0A0C10 100%);color:var(--ink-1);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:auto;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:40px 20px;box-sizing:border-box}
[data-theme="light"] body{background:radial-gradient(1200px 800px at 50% 30%,#E8EBF0 0%,#D5DAE3 100%)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
.ic{width:16px;height:16px}.ic-sm{width:14px;height:14px}
.window{position:relative;width:960px;height:640px;resize:both;min-width:480px;min-height:320px;max-width:95vw;max-height:95vh;overflow:hidden;border-radius:14px;box-shadow:0 24px 64px -16px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.scale-wrap{position:absolute;top:0;left:0;width:960px;height:640px;display:flex;flex-direction:column;background:var(--page);transform-origin:top left}
[data-theme="light"] .window{box-shadow:0 24px 64px -16px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.08)}
.resize-handle{position:absolute;right:4px;bottom:2px;width:14px;height:14px;color:var(--ink-3);opacity:.5;pointer-events:none;z-index:10}
.titlebar{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--logo-grad-1) 0%,var(--logo-grad-2) 60%,var(--logo-grad-3) 100%);display:grid;place-items:center;box-shadow:0 2px 8px -2px var(--logo-glow),inset 0 1px 0 var(--logo-highlight)}
.brand .logo svg{width:15px;height:15px;color:var(--on-accent)}
.brand .name{font-size:14px;font-weight:650}
.brand .ver{font-size:11.5px;color:var(--ink-3);margin-left:2px}
.env-status{display:flex;align-items:center;gap:6px;margin-left:8px}
.env-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(63,203,134,.6)}
.env-text{font-size:11.5px;color:var(--ink-3)}
.env-text b{color:var(--ink-2);font-weight:500}
.titlebar .sp{flex:1}
.win-ctrl{display:flex;gap:2px}
.win-ctrl button{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.win-ctrl button:hover{background:var(--panel-2);color:var(--ink-1)}
.win-ctrl button.close:hover{background:var(--bad-soft);color:var(--bad)}
.theme-btn{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s;margin-right:2px}
.theme-btn:hover{background:var(--panel-2);color:var(--ink-1)}
.theme-btn svg{width:15px;height:15px}
[data-theme="dark"] .theme-btn .icon-sun{display:block}
[data-theme="dark"] .theme-btn .icon-moon{display:none}
[data-theme="light"] .theme-btn .icon-sun{display:none}
[data-theme="light"] .theme-btn .icon-moon{display:block}
.config-bar{display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--border);flex:none}
.config-group{display:flex;align-items:center;gap:8px}
.config-group label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.path-input{flex:1;min-width:200px;display:flex;align-items:center;background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-control);overflow:hidden;transition:border-color .15s}
.path-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.path-input .folder-ic{padding:0 10px;color:var(--ink-3);display:flex;align-items:center;height:32px}
.path-input input{flex:1;background:transparent;border:0;outline:0;height:32px;font-size:12.5px;color:var(--ink-2);padding:0 4px}
.path-input input::placeholder{color:var(--ink-3)}
.btn-browse{height:32px;padding:0 14px;background:var(--panel-2);border-left:1px solid var(--border-strong);color:var(--ink-2);font-size:12px;transition:background .15s,color .15s}
.btn-browse:hover{background:var(--panel-3);color:var(--ink-1)}
.num-input{width:56px;height:32px;background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-control);text-align:center;font-size:13px;color:var(--ink-1);outline:0;transition:border-color .15s}
.num-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.config-divider{width:1px;height:20px;background:var(--border)}
.workspace{flex:1;display:grid;grid-template-columns:minmax(300px,35%) 1fr;gap:12px;padding:12px 18px;min-height:0}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-card);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.panel-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);flex:none}
.panel-head h2{font-size:13px;font-weight:600}
.panel-head .sub{font-size:11px;color:var(--ink-3);margin-left:2px}
.panel-head .sp{flex:1}
.panel-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--panel-3) transparent}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:3px}
.import-area{display:flex;flex-direction:column;min-height:0}
.import-textarea{flex:1 1 auto;min-height:120px;background:var(--panel);border:0;outline:0;resize:none;padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--ink-2);font-family:"SF Mono","Consolas","Menlo",monospace}
.import-textarea::placeholder{color:var(--ink-3);line-height:1.7}
.import-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--border);background:var(--bg);flex:none}
.batch-check{display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;user-select:none}
.batch-check .batch-label{font-size:12px;color:var(--ink-2)}
.batch-check .batch-label i{font-style:normal;color:var(--ink-3);margin-left:6px;font-size:11px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-control);font-size:12.5px;font-weight:500;border:1px solid var(--border-strong);background:var(--panel);color:var(--ink-2);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--panel-2);color:var(--ink-1);border-color:var(--border-hover)}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px;height:14px}
.btn-primary{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-2) 100%);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 8px -2px rgba(47,211,197,.35)}
.btn-primary:hover{background:linear-gradient(180deg,#3ADDD0 0%,#22C4B7 100%);color:var(--on-accent)}
.btn-danger{background:var(--bad-soft);border-color:rgba(255,107,90,.25);color:var(--bad)}
.btn-danger:hover{background:rgba(255,107,90,.2);border-color:rgba(255,107,90,.4)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn-ghost:hover{background:var(--panel-2);color:var(--ink-1)}
.btn-sm{height:28px;padding:0 10px;font-size:11.5px}
.btn-sm svg{width:13px;height:13px}
.btn-smart{width:100%;justify-content:center;height:36px;background:linear-gradient(180deg,rgba(47,211,197,.12) 0%,rgba(47,211,197,.06) 100%);border:1px solid rgba(47,211,197,.25);color:var(--accent);font-weight:500}
.btn-smart:hover{background:linear-gradient(180deg,rgba(47,211,197,.18) 0%,rgba(47,211,197,.1) 100%);border-color:rgba(47,211,197,.4);color:#45DDD0}
.task-count{font-size:11.5px;color:var(--ink-3)}
.task-count b{color:var(--ink-2);font-weight:600}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:var(--r-control);overflow:hidden}
.seg button{height:26px;padding:0 10px;font-size:11.5px;color:var(--ink-3);transition:all .15s}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.seg button:hover:not(.on){color:var(--ink-1)}
.task-table{width:100%;border-collapse:collapse}
.task-table th{text-align:left;padding:0 14px;height:34px;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.03em;background:var(--panel);border-bottom:1px solid var(--border);white-space:nowrap}
.task-table td{padding:0 14px;height:var(--row);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.task-table tbody tr{transition:background .12s}
.task-table tbody tr:hover{background:var(--panel)}
.task-table tbody tr:last-child td{border-bottom:0}
.task-table .col-check{width:36px}
.task-table .col-size{width:80px;text-align:right}
.task-table .col-progress{width:140px}
.task-table .col-speed{width:80px;text-align:right}
.task-table .col-status{width:80px}
.task-table .col-ops{width:70px;text-align:right}
.checkbox{width:16px;height:16px;border:1.5px solid var(--border-hover);border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;transition:all .15s;background:transparent}
.checkbox.on{background:var(--accent);border-color:var(--accent)}
.checkbox.on svg{width:11px;height:11px;color:var(--on-accent)}
.checkbox:hover{border-color:var(--accent)}
.task-name{display:flex;align-items:center;gap:10px;max-width:280px}
.task-name .file-ic{width:28px;height:28px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.task-name .file-ic svg{width:14px;height:14px;color:var(--ink-3)}
.task-name .file-ic.video{background:rgba(94,158,255,.12)}
.task-name .file-ic.video svg{color:var(--info)}
.task-name .meta{display:flex;flex-direction:column;min-width:0}
.task-name .meta .title{font-size:12.5px;color:var(--ink-1);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-name .meta .src{font-size:10.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:5px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .3s}
.progress-bar.done i{background:var(--ok)}
.progress-bar.error i{background:var(--bad)}
.progress-bar.paused i{background:var(--warn)}
.progress .pct{font-size:11px;color:var(--ink-3);min-width:34px;text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.downloading{background:var(--accent-soft);color:var(--accent)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.waiting{background:rgba(168,178,194,.1);color:var(--ink-3)}
.tag.error{background:var(--bad-soft);color:var(--bad)}
.tag.paused{background:var(--warn-soft);color:var(--warn)}
.row-ops{display:flex;gap:2px;justify-content:flex-end}
.row-ops button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);transition:all .15s}
.row-ops button:hover{background:var(--panel-3);color:var(--ink-1)}
.row-ops button svg{width:13px;height:13px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty-state .empty-ic{width:56px;height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:4px}
.empty-state .empty-ic svg{width:26px;height:26px;color:var(--ink-3)}
.empty-state b{font-size:14px;color:var(--ink-2);font-weight:500}
.empty-state p{font-size:12px;line-height:1.6;max-width:280px}
.bottom{flex:none;border-top:1px solid var(--border);background:var(--bg)}
.overall-bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border)}
.overall-bar .label{font-size:12px;color:var(--ink-3);white-space:nowrap}
.overall-bar .track{flex:1;height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.overall-bar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;position:relative}
.overall-bar .track i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.overall-bar .stats{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.overall-bar .stats b{color:var(--ink-1);font-weight:600}
.overall-bar .stats .speed{color:var(--accent)}
.log-area{height:88px;overflow-y:auto;padding:6px 18px;font-family:"SF Mono","Consolas","Menlo",monospace;font-size:11px;line-height:1.8;color:var(--ink-3);scrollbar-width:thin;scrollbar-color:var(--panel-3) transparent;border-bottom:1px solid var(--border)}
.log-area::-webkit-scrollbar{width:4px}
.log-area::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:2px}
.log-line{display:flex;gap:8px}
.log-line .time{color:var(--ink-3);flex:none}
.log-line .msg{color:var(--ink-2)}
.log-line .msg.ok{color:var(--ok)}.log-line .msg.warn{color:var(--warn)}.log-line .msg.err{color:var(--bad)}.log-line .msg.poem{color:var(--ink-3);font-style:italic}
.action-bar{display:flex;align-items:center;gap:8px;padding:10px 18px}
.action-bar .sp{flex:1}
.action-group{display:flex;gap:8px}
.action-divider{width:1px;height:24px;background:var(--border);align-self:center}
.btn-lg{height:36px;padding:0 22px;font-size:13px}
.btn-lg svg{width:15px;height:15px}
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.97);width:min(480px,90vw);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--r-shell);box-shadow:0 24px 64px -16px rgba(0,0,0,.65);padding:20px;opacity:0;pointer-events:none;transition:all .2s;z-index:51}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:15px;font-weight:600;margin-bottom:4px}
.modal .modal-sub{font-size:12px;color:var(--ink-3);margin-bottom:16px}
.modal .form-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.modal .form-row:last-of-type{border-bottom:0}
.modal .form-row label{font-size:12.5px;color:var(--ink-2);width:90px;flex:none}
.modal .form-row .val{flex:1;display:flex;align-items:center;gap:8px}
.modal .form-row .hint{font-size:11px;color:var(--ink-3);margin-top:2px}
.modal .modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.switch{width:36px;height:20px;border-radius:10px;background:var(--panel-3);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink-2);top:2px;left:2px;transition:all .2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px;background:var(--on-accent)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--r-control);padding:10px 18px;font-size:12.5px;color:var(--ink-1);box-shadow:0 24px 64px -16px rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:all .25s;z-index:60;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:14px;height:14px;color:var(--ok)}
</style>
</head>

  body.innerHTML='<table class="task-table"><thead><tr><th class="col-check"></th><th>文件名</th><th class="col-size">大小</th><th class="col-progress">进度</th><th class="col-speed">速度</th><th class="col-status">状态</th><th class="col-ops"></th></tr></thead><tbody>'+filtered.map(t=>{const st=statusMap[t.status];const barCls=t.status==="done"?"done":t.status==="error"?"error":t.status==="paused"?"paused":"";return '<tr><td class="col-check"><span class="checkbox on"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/></svg></span></td><td><div class="task-name"><div class="file-ic video"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M251.77,73a8,8,0,0,0-8.21.39L208,97.05V72a16,16,0,0,0-16-16H32A16,16,0,0,0,16,72V184a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V159l35.56,23.71A8,8,0,0,0,248,184a8,8,0,0,0,8-8V80A8,8,0,0,0,251.77,73ZM192,184H32V72H192V184Zm48-22.95-32-21.33V116.28L240,95Z"/></svg></div><div class="meta"><span class="title">'+t.name+'</span><span class="src">'+t.src+'</span></div></div></td><td class="col-size num">'+t.size+'</td><td class="col-progress"><div class="progress"><div class="progress-bar '+barCls+'"><i style="width:'+t.progress+'%"></i></div><span class="pct num">'+t.progress+'%</span></div></td><td class="col-speed num">'+(t.speed||"—")+'</td><td class="col-status"><span class="tag '+st.cls+'">'+st.label+'</span></td><td class="col-ops"><div class="row-ops"><button title="打开文件"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"/></svg></button><button title="删除"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg></button></div></td></tr>';}).join("")+'</tbody></table>';
}
renderTasks();updateOverall();
document.getElementById("logArea").scrollTop=document.getElementById("logArea").scrollHeight;
function updateOverall(){const done=tasks.filter(t=>t.status==="done").length;const total=tasks.length;const avg=Math.round(tasks.reduce((s,t)=>s+t.progress,0)/total);document.getElementById("doneCount").textContent=done;document.getElementById("totalCount").textContent=total;document.getElementById("taskTotal").textContent=total;document.getElementById("overallTrack").style.width=avg+"%";}
document.querySelectorAll("#filterSeg button").forEach(b=>{b.onclick=()=>{document.querySelectorAll("#filterSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderTasks(b.dataset.filter);};});
document.getElementById("selectAll").onclick=()=>{const c=document.getElementById("allCheck");c.classList.toggle("on");showToast(c.classList.contains("on")?"已全选所有任务":"已取消全选");};
let downloading=false;
document.getElementById("startBtn").onclick=()=>{if(downloading){showToast("任务已在下载中");return;}downloading=true;addLog("开始下载任务：季度复盘会议录像","ok");showToast("已开始下载");const task=tasks.find(t=>t.status==="downloading");if(task){const timer=setInterval(()=>{task.progress+=2;if(task.progress>=100){task.progress=100;task.status="done";task.speed="";clearInterval(timer);downloading=false;addLog("季度复盘会议录像 下载完成","ok");showToast("下载完成：季度复盘会议录像");}renderTasks(document.querySelector("#filterSeg button.on").dataset.filter);updateOverall();},300);}};
document.getElementById("stopBtn").onclick=()=>{downloading=false;const task=tasks.find(t=>t.status==="downloading");if(task){task.status="paused";task.speed="";}renderTasks();addLog("下载已暂停","warn");showToast("已暂停下载");};
document.getElementById("parseBtn").onclick=()=>{const ta=document.querySelector(".import-textarea");if(!ta.value.trim()){showToast("请先粘贴下载链接");return;}addLog("解析链接完成，已添加 1 个任务","ok");showToast("已解析到任务列表");};
document.getElementById("openDirBtn").onclick=()=>showToast("已打开保存目录");
document.getElementById("reloginBtn").onclick=()=>{addLog("正在跳转钉钉授权登录…","");showToast("正在打开登录页面");};
document.getElementById("updateBtn").onclick=()=>{addLog("当前已是最新版本 v1.0","ok");showToast("当前已是最新版本");};
document.getElementById("importText").onclick=()=>{document.querySelector(".import-textarea").value="https://dingtalk.com/live/xxxxxx\nhttps://dingtalk.com/group/playback/yyyyyy";showToast("已导入文本链接");};
document.getElementById("importQr").onclick=()=>showToast("请选择二维码图片");
document.getElementById("clearInput").onclick=()=>{document.querySelector(".import-textarea").value="";showToast("已清空输入");};
document.getElementById("batchCheckWrap").addEventListener("click",function(e){e.preventDefault();document.getElementById("batchCheck").classList.toggle("on");});
document.getElementById("smartGrab").onclick=()=>{addLog("正在扫描已打开的钉钉群回放页面…","");setTimeout(()=>{addLog("发现 2 个已加载的群回放，已按群名保存","ok");showToast("已获取 2 个群回放链接");},800);};
const scrim=document.getElementById("scrim"),modal=document.getElementById("settingsModal");
function openModal(on){scrim.classList.toggle("on",on);modal.classList.toggle("on",on);}
document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||"dark";const next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);showToast(next==="light"?"已切换到浅色主题":"已切换到深色主题");};
document.getElementById("settingsBtn").onclick=()=>openModal(true);
scrim.onclick=()=>openModal(false);
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>openModal(false));
document.querySelectorAll(".switch").forEach(s=>{s.onclick=()=>s.classList.toggle("on");});
function addLog(msg,type=""){const area=document.getElementById("logArea");const now=new Date();const t="["+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":"+String(now.getSeconds()).padStart(2,"0")+"]";const line=document.createElement("div");line.className="log-line";line.innerHTML='<span class="time">'+t+'</span><span class="msg '+type+'">'+msg+'</span>';area.appendChild(line);area.scrollTop=area.scrollHeight;}
let toastTimer;
function showToast(msg){const t=document.getElementById("toast");document.getElementById("toastMsg").textContent=msg;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("on"),2000);}
(function(){
  const win=document.querySelector('.window');
  const wrap=document.querySelector('.scale-wrap');
  function fit(){
    const r=win.getBoundingClientRect();
    const s=Math.min(r.width/960, r.height/640);
    wrap.style.transform='scale('+s+')';
    wrap.style.left=((r.width-960*s)/2)+'px';
    wrap.style.top=((r.height-640*s)/2)+'px';
  }
  fit();
  new ResizeObserver(fit).observe(win);
})();
</script>
